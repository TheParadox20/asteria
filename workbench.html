<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteria | Workbench</title>
  </head>
  <body class="text-white">
    <main class="workbench py-[clamp(1.5rem,3vw,3rem)]">
      <h1 class="sr-only">Discover manga on Asteria</h1>

      <!-- Compact posters with a translucent, fading rank over the artwork. -->
      <section id="top-ten" data-shelf aria-labelledby="top-ten-title">
        <div class="shelf-heading flex items-center justify-between gap-4">
          <h2 id="top-ten-title" class="text-[clamp(1rem,1.35vw,1.25rem)] font-semibold tracking-tight">Top 10 This Week</h2>
          <div class="flex shrink-0 gap-1" role="group" aria-label="Browse top 10">
            <button data-prev type="button" class="shelf-arrow" aria-label="Previous top 10 titles" aria-controls="top-ten-track" disabled>
              <span aria-hidden="true" class="icon-[codicon--chevron-left] size-5"></span>
            </button>
            <button data-next type="button" class="shelf-arrow" aria-label="Next top 10 titles" aria-controls="top-ten-track">
              <span aria-hidden="true" class="icon-[codicon--chevron-right] size-5"></span>
            </button>
          </div>
        </div>
        <ol id="top-ten-track" data-track class="shelf-track shelf-track--ranked" tabindex="0" aria-labelledby="top-ten-title"></ol>
      </section>

      <!-- Larger artwork with a graduated frosted-glass surface behind the copy. -->
      <section id="essential-reads" data-shelf class="mt-[clamp(1.5rem,2.4vw,2.5rem)]" aria-labelledby="essential-reads-title">
        <div class="shelf-heading flex items-center justify-between gap-4">
          <h2 id="essential-reads-title" class="text-[clamp(1rem,1.35vw,1.25rem)] font-semibold tracking-tight">Essential Reads on Asteria</h2>
          <div class="flex shrink-0 gap-1" role="group" aria-label="Browse essential reads">
            <button data-prev type="button" class="shelf-arrow" aria-label="Previous essential reads" aria-controls="essential-reads-track" disabled>
              <span aria-hidden="true" class="icon-[codicon--chevron-left] size-5"></span>
            </button>
            <button data-next type="button" class="shelf-arrow" aria-label="Next essential reads" aria-controls="essential-reads-track">
              <span aria-hidden="true" class="icon-[codicon--chevron-right] size-5"></span>
            </button>
          </div>
        </div>
        <ul id="essential-reads-track" data-track class="shelf-track shelf-track--featured" tabindex="0" aria-labelledby="essential-reads-title"></ul>
      </section>
      <noscript><p class="shelf-heading mt-6 text-muted">Enable JavaScript to view the manga collections.</p></noscript>
    </main>

    <!-- Same template + data-attribute pattern used by the index page. -->
    <template id="ranked-card-template">
      <li class="min-w-0 snap-start">
        <article class="manga-card ranked-card">
          <img data-img class="manga-card-art" alt="" decoding="async" />
          <div class="ranked-card-shade" aria-hidden="true"></div>
          <span data-rank class="ranked-card-number" aria-hidden="true"></span>
          <div class="ranked-card-copy absolute inset-x-0 bottom-0 text-center">
            <h3 data-title class="text-[clamp(0.875rem,1.1vw,1.0625rem)] font-bold leading-tight"></h3>
            <p data-format class="mt-1 text-xs text-white/75"></p>
          </div>
        </article>
      </li>
    </template>

    <template id="featured-card-template">
      <li class="min-w-0 snap-start">
        <article class="manga-card featured-card">
          <img data-img class="manga-card-art" alt="" loading="lazy" decoding="async" />
          <div class="featured-card-glass" aria-hidden="true"></div>
          <div class="featured-card-shade" aria-hidden="true"></div>
          <div class="featured-card-copy absolute inset-x-0 bottom-0">
            <h3 data-title class="font-display text-[clamp(1.75rem,2.8vw,2.75rem)] leading-[1.05] tracking-tight text-white"></h3>
            <p data-meta class="mt-2 text-[clamp(0.75rem,0.95vw,0.875rem)] leading-relaxed text-white/85"></p>
            <p data-note class="mt-3 text-[clamp(0.75rem,0.85vw,0.8125rem)] leading-relaxed text-white/75"></p>
          </div>
        </article>
      </li>
    </template>

    <script type="module" src="/src/workbench.ts"></script>
  </body>
</html>
